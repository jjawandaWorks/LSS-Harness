<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LSS Harness" />
    <title>LSS Harness</title>

    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/lss-mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/lss-touch-icon.png" />


  </head>
  <body class="bg-dls-surface text-dls-text mac:bg-transparent">
    <div id="root">
      <!-- Visible even when the entry bundle cannot load. React replaces this on mount. -->
      <div style="min-height: 100dvh; display: flex; align-items: center; justify-content: center; font: 14px system-ui; text-align: center; padding: 24px; box-sizing: border-box">
        <div>
          <p role="status">Starting LSS Harness</p>
          <div id="startup-recovery" hidden>
            <p>LSS Harness is taking longer than usual to start.</p>
            <button type="button" onclick="window.location.reload()" style="font: inherit; padding: 8px 16px; cursor: pointer">Reload</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var recovery = document.getElementById("startup-recovery");
        if (recovery) recovery.hidden = false;
      }, 45000);
    </script>
    <script type="module" src="/src/index.react.tsx"></script>
  </body>
</html>
